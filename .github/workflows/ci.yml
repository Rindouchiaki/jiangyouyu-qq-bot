# 每次推送 / PR：在 Windows 上检查脚本语法、装锁定的依赖、跑单元测试和 NoneBot 冒烟（不连早柚核心）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # htmlrender 把浏览器装在自己的 render_storage_path 下，CI 里固定到可缓存的目录
      RENDER_STORAGE_PATH: D:\a\htmlrender
    steps:
      # 仓库里的 .ps1 要原样的 BOM + CRLF，别让 Git 转换行符
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2

      - name: PowerShell 5.1 语法检查
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts\*.ps1, tools\*.ps1, tests\*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: persona.env 同步（一键更新）
        shell: powershell
        run: |
          & .\tests\test_env_sync.ps1
          exit $LASTEXITCODE

      - name: 装依赖（requirements.lock）
        shell: cmd
        run: |
          uv venv .venv --python 3.12 || exit /b 1
          uv pip install --python .venv\Scripts\python.exe -r requirements.lock

      # 冒烟启动时，bison 要渲染卡片就得有 chromium；不预装会临时下载、来不及起来
      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: D:\a\htmlrender
          key: playwright-chromium-${{ hashFiles('requirements.lock') }}

      - name: 装 Chromium
        shell: cmd
        env:
          PLAYWRIGHT_BROWSERS_PATH: D:\a\htmlrender
        run: .venv\Scripts\python -m playwright install chromium

      - name: 单元测试
        shell: cmd
        run: |
          .venv\Scripts\python tests\test_persona_rules.py || exit /b 1
          .venv\Scripts\python tests\test_gscore_guard.py || exit /b 1
          .venv\Scripts\python tests\test_bonds.py || exit /b 1
          .venv\Scripts\python tests\test_slang.py || exit /b 1
          .venv\Scripts\python tests\test_topics.py || exit /b 1
          .venv\Scripts\python tests\test_sticker_weights.py || exit /b 1
          .venv\Scripts\python tests\test_backstage.py || exit /b 1
          .venv\Scripts\python tests\test_migrate_journal_tags.py || exit /b 1
          .venv\Scripts\python tests\test_bili_group.py || exit /b 1
          .venv\Scripts\python tests\test_push_marks.py || exit /b 1

      - name: NoneBot 冒烟
        shell: cmd
        run: .venv\Scripts\python tests\smoke_stack.py --start-bot
